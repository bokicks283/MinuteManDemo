name: mmpdemo

services:
  app:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    command: sh -c "composer install --no-interaction --prefer-dist && exec apache2-foreground"

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mmpdemo}
      DB_USERNAME: ${MYSQL_USER:-mmpdemo}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mmpdemo}
      MYSQL_USER: ${MYSQL_USER:-mmpdemo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 30s
      timeout: 15s
      retries: 5

volumes:
  mysql_data: {}
